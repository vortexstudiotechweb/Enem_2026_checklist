<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checklist ENEM 2026 — Painel de Estudos</title>

  <style>
    :root {
      --background: #0f172a;
      --card: #1e293b;
      --foreground: #f8fafc;
      --muted-foreground: #94a3b8;
      --border: #334155;
      --primary: #3b82f6;
      --primary-foreground: #ffffff;
    }
    html.light {
      --background: #f8fafc;
      --card: #ffffff;
      --foreground: #0f172a;
      --muted-foreground: #64748b;
      --border: #e2e8f0;
      --primary: #2563eb;
      --primary-foreground: #ffffff;
    }
  </style>
</head>
<body class="bg-[var(--background)] text-[var(--foreground)] antialiased p-4 md:p-6">
  <div class="max-w-6xl mx-auto space-y-6">

    <!-- Header & Global Progress -->
    <header class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-5 shadow-sm">
      <div class="flex flex-col md:flex-row md:items-center md:justify-between gap-4">
        <div>
          <div class="flex items-center gap-2">
            <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold bg-[var(--primary)] text-[var(--primary-foreground)]">ENEM 2026</span>
            <span id="save-indicator" class="text-xs text-[var(--muted-foreground)]">Salvo automaticamente</span>
          </div>
          <h1 class="text-xl md:text-2xl font-bold text-[var(--foreground)] mt-1">Checklist Sequencial de Estudos</h1>
          <p class="text-sm text-[var(--muted-foreground)]">Estude um assunto por vez, marque como concluído e avance automaticamente para o próximo.</p>
        </div>

        <div class="flex flex-wrap items-center gap-2">
          <button id="btn-export" class="px-3 py-1.5 text-xs font-medium rounded-lg border border-[var(--border)] bg-[var(--background)] text-[var(--foreground)] hover:opacity-80 transition">
            Exportar Backup (.json)
          </button>
          <label class="px-3 py-1.5 text-xs font-medium rounded-lg border border-[var(--border)] bg-[var(--background)] text-[var(--foreground)] hover:opacity-80 transition cursor-pointer">
            Importar Backup
            <input type="file" id="input-import" accept=".json" class="hidden" />
          </label>
          <button id="btn-reset" class="px-3 py-1.5 text-xs font-medium rounded-lg border border-[var(--border)] text-[var(--muted-foreground)] hover:text-red-500 transition">
            Zerar Progresso
          </button>
        </div>
      </div>

      <!-- Overall Progress Bar -->
      <div class="mt-5 pt-4 border-t border-[var(--border)]">
        <div class="flex items-center justify-between text-sm mb-2">
          <span class="font-medium text-[var(--foreground)]">Progresso Geral do Edital</span>
          <span id="overall-stats" class="font-semibold text-[var(--foreground)]">0 / 0 concluídos (0%)</span>
        </div>
        <div class="w-full h-3 bg-[var(--background)] border border-[var(--border)] rounded-full overflow-hidden">
          <div id="overall-bar" class="h-full bg-[var(--primary)] transition-all duration-300" style="width: 0%"></div>
        </div>

        <!-- Area Mini Progress Cards -->
        <div id="area-summary-grid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3 mt-4"></div>
      </div>
    </header>

    <!-- "Up Next" Sequential Study Card -->
    <section class="bg-[var(--card)] border-2 border-[var(--primary)] rounded-xl p-5 shadow-sm">
      <div class="flex flex-col lg:flex-row lg:items-center lg:justify-between gap-4">
        <div class="space-y-1">
          <div class="flex flex-wrap items-center gap-2">
            <span class="text-xs font-bold uppercase tracking-wider text-[var(--primary)]">Assunto Atual da Fila</span>
            <span id="next-area-badge" class="text-xs px-2 py-0.5 rounded bg-[var(--background)] border border-[var(--border)] text-[var(--muted-foreground)]"></span>
            <span id="next-hot-badge" class="hidden text-xs px-2 py-0.5 rounded bg-amber-500/20 text-amber-500 font-semibold">🔥 Alta Incidência</span>
          </div>
          <h2 id="next-topic-title" class="text-lg font-bold text-[var(--foreground)]">Carregando...</h2>
          <p id="next-topic-group" class="text-sm text-[var(--muted-foreground)]"></p>
        </div>

        <div class="flex flex-wrap items-center gap-2 shrink-0">
          <button id="btn-complete-next" class="px-4 py-2.5 rounded-lg text-sm font-semibold bg-[var(--primary)] text-[var(--primary-foreground)] hover:opacity-90 transition shadow-sm">
            ✓ Concluir e Ir para o Próximo
          </button>
          <button id="btn-skip-next" class="px-3 py-2.5 rounded-lg text-xs font-medium border border-[var(--border)] bg-[var(--background)] text-[var(--foreground)] hover:opacity-80 transition">
            Pular por enquanto →
          </button>
          <button id="btn-locate-next" class="px-3 py-2.5 rounded-lg text-xs font-medium border border-[var(--border)] bg-[var(--background)] text-[var(--muted-foreground)] hover:text-[var(--foreground)] transition">
            Ver na lista
          </button>
        </div>
      </div>
    </section>

    <!-- Filters & Controls -->
    <section class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-4 shadow-sm space-y-4">
      <!-- Area Tabs -->
      <div id="area-tabs" class="flex flex-wrap gap-2 border-b border-[var(--border)] pb-3"></div>

      <!-- Subject Pills (Dynamic based on selected area) -->
      <div id="subject-pills" class="flex flex-wrap gap-1.5"></div>

      <!-- Search, Status Filter, Priority Filter -->
      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3 pt-1">
        <div class="sm:col-span-2">
          <input
            type="text"
            id="search-input"
            placeholder="Buscar assunto (ex: Ecologia, Eletrodinâmica, Vargas, Funções...)"
            class="w-full px-3.5 py-2 text-sm rounded-lg border border-[var(--border)] bg-[var(--background)] text-[var(--foreground)] placeholder-[var(--muted-foreground)] focus:outline-none focus:border-[var(--primary)]"
          />
        </div>

        <div>
          <select id="status-filter" class="w-full px-3 py-2 text-sm rounded-lg border border-[var(--border)] bg-[var(--background)] text-[var(--foreground)] focus:outline-none focus:border-[var(--primary)]">
            <option value="all">Status: Todos os assuntos</option>
            <option value="pending">Apenas Pendentes</option>
            <option value="done">Apenas Concluídos</option>
            <option value="review">Marcados para Revisão</option>
          </select>
        </div>

        <div class="flex items-center justify-between gap-2 px-3 py-2 rounded-lg border border-[var(--border)] bg-[var(--background)]">
          <label for="hot-filter" class="text-sm text-[var(--foreground)] cursor-pointer select-none">
            Apenas 🔥 Mais Cobrados
          </label>
          <input type="checkbox" id="hot-filter" class="w-4 h-4 accent-[var(--primary)] cursor-pointer" />
        </div>
      </div>
    </section>

    <!-- Checklist Content -->
    <main id="checklist-container" class="space-y-4"></main>

  </div>

    // App State
    let state = {
      completed: {}, // { [itemId]: true }
      review: {},    // { [itemId]: true }
      notes: {},     // { [itemId]: "string" }
      skippedOffset: 0,
      activeArea: "all",
      activeSubject: "all",
      search: "",
      statusFilter: "all",
      hotOnly: false
    };

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          state.completed = parsed.completed || {};
          state.review = parsed.review || {};
          state.notes = parsed.notes || {};
        }
      } catch (e) {
        console.warn("Erro ao carregar estado do localStorage:", e);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(
          STORAGE_KEY,
          JSON.stringify({
            completed: state.completed,
            review: state.review,
            notes: state.notes,
            updatedAt: new Date().toISOString()
          })
        );
        const ind = document.getElementById("save-indicator");
        ind.textContent = "✓ Progresso salvo (" + new Date().toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" }) + ")";
      } catch (e) {
        console.warn("Erro ao salvar no localStorage:", e);
      }
    }

    function getPendingQueue() {
      return ALL_ITEMS.filter((item) => {
        if (state.completed[item.id]) return false;
        if (state.activeArea !== "all" && item.areaId !== state.activeArea) return false;
        if (state.activeSubject !== "all" && item.subjectId !== state.activeSubject) return false;
        if (state.hotOnly && !item.hot) return false;
        return true;
      });
    }

      const groupEl = document.getElementById("next-topic-group");
      const badgeEl = document.getElementById("next-area-badge");
      const hotEl = document.getElementById("next-hot-badge");
      const btnComplete = document.getElementById("btn-complete-next");
      const btnSkip = document.getElementById("btn-skip-next");
      const btnLocate = document.getElementById("btn-locate-next");

      if (pending.length === 0) {
        titleEl.textContent = "Parabéns! Todos os assuntos deste filtro foram concluídos!";
        groupEl.textContent = "Altere os filtros abaixo ou selecione outra área para continuar estudando.";
        badgeEl.textContent = "100% Concluído";
        hotEl.classList.add("hidden");
        btnComplete.disabled = true;
        btnComplete.classList.add("opacity-50", "cursor-not-allowed");
        btnSkip.classList.add("hidden");
        btnLocate.classList.add("hidden");
        return;
      }

      btnComplete.disabled = false;
      btnComplete.classList.remove("opacity-50", "cursor-not-allowed");
      btnSkip.classList.remove("hidden");
      btnLocate.classList.remove("hidden");

      const idx = state.skippedOffset % pending.length;
      const current = pending[idx];

      titleEl.textContent = current.text;
      groupEl.textContent = `${current.subjectName} • ${current.groupTitle}`;
      badgeEl.textContent = `${current.areaShort} (${idx + 1} de ${pending.length} restantes no filtro)`;
      if (current.hot) {
        hotEl.classList.remove("hidden");
      } else {
        hotEl.classList.add("hidden");
      }

      btnComplete.onclick = () => {
        state.completed[current.id] = true;
        state.skippedOffset = 0;
        saveState();
        renderAll();
      };

      btnSkip.onclick = () => {
        state.skippedOffset = (state.skippedOffset + 1) % pending.length;
        renderUpNext();
      };

      btnLocate.onclick = () => {
        const el = document.getElementById(`item-row-${current.id}`);
        if (el) {
          el.scrollIntoView({ behavior: "smooth", block: "center" });
          el.classList.add("ring-2", "ring-[var(--primary)]");
          setTimeout(() => el.classList.remove("ring-2", "ring-[var(--primary)]"), 2000);
        }
      };
    }

    function renderStats() {
      const total = ALL_ITEMS.length;
      const done = ALL_ITEMS.filter((i) => state.completed[i.id]).length;
      const pct = total > 0 ? Math.round((done / total) * 100) : 0;

      document.getElementById("overall-stats").textContent = `${done} / ${total} concluídos (${pct}%)`;
      document.getElementById("overall-bar").style.width = `${pct}%`;

      const summaryGrid = document.getElementById("area-summary-grid");
      summaryGrid.innerHTML = "";

      ENEM_DATA.forEach((areaObj) => {
        const areaItems = ALL_ITEMS.filter((i) => i.areaId === areaObj.id);
        const areaDone = areaItems.filter((i) => state.completed[i.id]).length;
        const areaPct = areaItems.length > 0 ? Math.round((areaDone / areaItems.length) * 100) : 0;

        const card = document.createElement("button");
        card.type = "button";
        card.className = `text-left p-3 rounded-lg border transition ${
          state.activeArea === areaObj.id
            ? "border-[var(--primary)] bg-[var(--background)]"
            : "border-[var(--border)] bg-[var(--background)] hover:opacity-80"
        }`;
        card.onclick = () => {
          state.activeArea = state.activeArea === areaObj.id ? "all" : areaObj.id;
          state.activeSubject = "all";
          state.skippedOffset = 0;
          renderAll();
        };

        card.innerHTML = `
          <div class="flex items-center justify-between text-xs font-semibold text-[var(--foreground)]">
            <span class="truncate">${areaObj.shortName}</span>
            <span>${areaPct}%</span>
          </div>
          <div class="w-full h-1.5 bg-[var(--card)] border border-[var(--border)] rounded-full overflow-hidden mt-1.5">
            <div class="h-full bg-[var(--primary)] transition-all duration-300" style="width: ${areaPct}%"></div>
          </div>
          <div class="text-xs text-[var(--muted-foreground)] mt-1">${areaDone}/${areaItems.length} tópicos</div>
        `;
        summaryGrid.appendChild(card);
      });
    }

    function renderTabs() {
      const areaTabs = document.getElementById("area-tabs");
      areaTabs.innerHTML = "";

      const tabs = [{ id: "all", label: "Todas as Áreas" }, ...ENEM_DATA.map((a) => ({ id: a.id, label: a.area }))];

      tabs.forEach((t) => {
        const active = state.activeArea === t.id;
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `px-3.5 py-1.5 rounded-lg text-xs font-semibold transition ${
          active
            ? "bg-[var(--primary)] text-[var(--primary-foreground)]"
            : "bg-[var(--background)] text-[var(--foreground)] border border-[var(--border)] hover:opacity-80"
        }`;
        btn.textContent = t.label;
        btn.onclick = () => {
          state.activeArea = t.id;
          state.activeSubject = "all";
          state.skippedOffset = 0;
          renderAll();
        };
        areaTabs.appendChild(btn);
      });

      // Subject Pills
      const subjectPills = document.getElementById("subject-pills");
      subjectPills.innerHTML = "";

      const relevantSubjects = [];
      ENEM_DATA.forEach((a) => {
        if (state.activeArea === "all" || state.activeArea === a.id) {
          a.subjects.forEach((s) => relevantSubjects.push({ ...s, areaId: a.id }));
        }
      });

      const allSubjBtn = document.createElement("button");
      allSubjBtn.type = "button";
      allSubjBtn.className = `px-2.5 py-1 rounded-md text-xs font-medium transition ${
        state.activeSubject === "all"
          ? "bg-[var(--foreground)] text-[var(--background)]"
          : "bg-[var(--background)] text-[var(--muted-foreground)] border border-[var(--border)] hover:text-[var(--foreground)]"
      }`;
      allSubjBtn.textContent = "Todas as Matérias";
      allSubjBtn.onclick = () => {
        state.activeSubject = "all";
        state.skippedOffset = 0;
        renderAll();
      };
      subjectPills.appendChild(allSubjBtn);

      relevantSubjects.forEach((s) => {
        const sItems = ALL_ITEMS.filter((i) => i.subjectId === s.id);
        const sDone = sItems.filter((i) => state.completed[i.id]).length;
        const active = state.activeSubject === s.id;

        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = `px-2.5 py-1 rounded-md text-xs font-medium transition ${
          active
            ? "bg-[var(--foreground)] text-[var(--background)]"
            : "bg-[var(--background)] text-[var(--muted-foreground)] border border-[var(--border)] hover:text-[var(--foreground)]"
        }`;
        btn.textContent = `${s.name} (${sDone}/${sItems.length})`;
        btn.onclick = () => {
          state.activeSubject = s.id;
          state.skippedOffset = 0;
          renderAll();
        };
        subjectPills.appendChild(btn);
      });
    }

    function renderChecklist() {
      const container = document.getElementById("checklist-container");
      container.innerHTML = "";

      const query = state.search.trim().toLowerCase();
      let visibleCount = 0;

      ENEM_DATA.forEach((areaObj) => {
        if (state.activeArea !== "all" && state.activeArea !== areaObj.id) return;

        areaObj.subjects.forEach((subjObj) => {
          if (state.activeSubject !== "all" && state.activeSubject !== subjObj.id) return;

          // Filter groups and items
          const renderedGroups = [];

          subjObj.groups.forEach((groupObj, gIdx) => {
            if (state.hotOnly && !groupObj.hot) return;

            const matchingItems = [];
            groupObj.items.forEach((itemText, iIdx) => {
              const id = `${areaObj.id}__${subjObj.id}__${gIdx}__${iIdx}`;
              const isDone = !!state.completed[id];
              const isReview = !!state.review[id];
              const noteText = state.notes[id] || "";

              if (state.statusFilter === "pending" && isDone) return;
              if (state.statusFilter === "done" && !isDone) return;
              if (state.statusFilter === "review" && !isReview) return;

              if (query) {
                const hay = `${subjObj.name} ${groupObj.title} ${itemText} ${noteText}`.toLowerCase();
                if (!hay.includes(query)) return;
              }

              matchingItems.push({ id, text: itemText, isDone, isReview, noteText });
            });

            if (matchingItems.length > 0) {
              renderedGroups.push({
                title: groupObj.title,
                hot: groupObj.hot,
                items: matchingItems
              });
            }
          });

          if (renderedGroups.length === 0) return;

          visibleCount += renderedGroups.reduce((acc, g) => acc + g.items.length, 0);

          const subjAllItems = ALL_ITEMS.filter((i) => i.subjectId === subjObj.id);
          const subjDoneCount = subjAllItems.filter((i) => state.completed[i.id]).length;
          const subjPct = subjAllItems.length > 0 ? Math.round((subjDoneCount / subjAllItems.length) * 100) : 0;

          const section = document.createElement("section");
          section.className = "bg-[var(--card)] border border-[var(--border)] rounded-xl p-5 shadow-sm space-y-4";

          const header = document.createElement("div");
          header.className = "flex flex-col sm:flex-row sm:items-center sm:justify-between gap-2 pb-3 border-b border-[var(--border)]";
          header.innerHTML = `
            <div>
              <span class="text-xs font-semibold text-[var(--muted-foreground)] uppercase tracking-wider">${areaObj.area}</span>
              <h3 class="text-lg font-bold text-[var(--foreground)]">${subjObj.name}</h3>
            </div>
            <div class="flex items-center gap-3">
              <span class="text-xs font-semibold text-[var(--muted-foreground)]">${subjDoneCount}/${subjAllItems.length} (${subjPct}%)</span>
              <div class="w-28 h-2 bg-[var(--background)] border border-[var(--border)] rounded-full overflow-hidden">
                <div class="h-full bg-[var(--primary)] transition-all duration-300" style="width: ${subjPct}%"></div>
              </div>
            </div>
          `;
          section.appendChild(header);

          renderedGroups.forEach((g) => {
            const groupBox = document.createElement("div");
            groupBox.className = "space-y-2 pt-1";

            const groupHeader = document.createElement("div");
            groupHeader.className = "flex items-center justify-between gap-2";

            const allGroupDone = g.items.every((i) => i.isDone);

            groupHeader.innerHTML = `
              <div class="flex items-center gap-2">
                <h4 class="text-sm font-semibold text-[var(--foreground)]">${g.title}</h4>
                ${
                  g.hot
                    ? '<span class="text-xs px-2 py-0.5 rounded bg-amber-500/20 text-amber-500 font-semibold">🔥 Alta Incidência</span>'
                    : ""
                }
              </div>
              <button type="button" class="btn-toggle-group text-xs text-[var(--muted-foreground)] hover:text-[var(--foreground)] underline">
                ${allGroupDone ? "Desmarcar bloco" : "Marcar bloco"}
              </button>
            `;

            groupHeader.querySelector(".btn-toggle-group").onclick = () => {
              const targetState = !allGroupDone;
              g.items.forEach((it) => {
                if (targetState) state.completed[it.id] = true;
                else delete state.completed[it.id];
              });
              saveState();
              renderAll();
            };

            groupBox.appendChild(groupHeader);

            const list = document.createElement("div");
            list.className = "space-y-1.5";

            g.items.forEach((item) => {
              const row = document.createElement("div");
              row.id = `item-row-${item.id}`;
              row.className = `p-3 rounded-lg border transition ${
                item.isDone
                  ? "bg-[var(--background)] border-[var(--border)] opacity-70"
                  : "bg-[var(--background)] border-[var(--border)]"
              }`;

              const mainLine = document.createElement("div");
              mainLine.className = "flex items-start justify-between gap-3";

              const label = document.createElement("label");
              label.className = "flex items-start gap-3 cursor-pointer flex-1 select-none";

              const checkbox = document.createElement("input");
              checkbox.type = "checkbox";
              checkbox.checked = item.isDone;
              checkbox.className = "mt-1 w-4 h-4 accent-[var(--primary)] cursor-pointer shrink-0";
              checkbox.onchange = () => {
                if (checkbox.checked) state.completed[item.id] = true;
                else delete state.completed[item.id];
                state.skippedOffset = 0;
                saveState();
                renderAll();
              };

              const span = document.createElement("span");
              span.className = `text-sm ${
                item.isDone ? "line-through text-[var(--muted-foreground)]" : "text-[var(--foreground)]"
              }`;
              span.textContent = item.text;

              label.appendChild(checkbox);
              label.appendChild(span);

              const actions = document.createElement("div");
              actions.className = "flex items-center gap-1.5 shrink-0";

              // Review flag button
              const btnRev = document.createElement("button");
              btnRev.type = "button";
              btnRev.title = "Marcar para Revisão";
              btnRev.className = `px-2 py-0.5 rounded text-xs font-medium border transition ${
                item.isReview
                  ? "border-amber-500 text-amber-500 bg-amber-500/10"
                  : "border-[var(--border)] text-[var(--muted-foreground)] hover:text-[var(--foreground)]"
              }`;
              btnRev.textContent = item.isReview ? "★ Revisar" : "☆ Revisar";
              btnRev.onclick = () => {
                if (state.review[item.id]) delete state.review[item.id];
                else state.review[item.id] = true;
                saveState();
                renderAll();
              };

              // Note toggle button
              const btnNote = document.createElement("button");
              btnNote.type = "button";
              btnNote.className = `px-2 py-0.5 rounded text-xs font-medium border transition ${
                item.noteText
                  ? "border-[var(--primary)] text-[var(--primary)]"
                  : "border-[var(--border)] text-[var(--muted-foreground)] hover:text-[var(--foreground)]"
              }`;
              btnNote.textContent = item.noteText ? "📝 Nota" : "+ Nota";

              actions.appendChild(btnRev);
              actions.appendChild(btnNote);

              mainLine.appendChild(label);
              mainLine.appendChild(actions);
              row.appendChild(mainLine);

              // Note input area
              const noteBox = document.createElement("div");
              noteBox.className = item.noteText ? "mt-2 pl-7" : "hidden mt-2 pl-7";

              const noteInput = document.createElement("input");
              noteInput.type = "text";
              noteInput.value = item.noteText;
              noteInput.placeholder = "Anotar resumo, página da apostila ou qtd de acertos...";
              noteInput.className =
                "w-full px-2.5 py-1.5 text-xs rounded border border-[var(--border)] bg-[var(--card)] text-[var(--foreground)] placeholder-[var(--muted-foreground)] focus:outline-none focus:border-[var(--primary)]";

              noteInput.onchange = () => {
                const val = noteInput.value.trim();
                if (val) state.notes[item.id] = val;
                else delete state.notes[item.id];
                saveState();
              };

              btnNote.onclick = () => {
                noteBox.classList.toggle("hidden");
                if (!noteBox.classList.contains("hidden")) noteInput.focus();
              };

              noteBox.appendChild(noteInput);
              row.appendChild(noteBox);

              list.appendChild(row);
            });

            groupBox.appendChild(list);
            section.appendChild(groupBox);
          });

          container.appendChild(section);
        });
      });

      if (visibleCount === 0) {
        container.innerHTML = `
          <div class="bg-[var(--card)] border border-[var(--border)] rounded-xl p-8 text-center space-y-2">
            <p class="text-base font-semibold text-[var(--foreground)]">Nenhum assunto encontrado para este filtro.</p>
            <p class="text-sm text-[var(--muted-foreground)]">Tente limpar a busca ou alterar os filtros de status.</p>
          </div>
        `;
      }
    }

    function renderAll() {
      renderStats();
      renderUpNext();
      renderTabs();
      renderChecklist();
    }

    // Event Listeners
    document.getElementById("search-input").addEventListener("input", (e) => {
      state.search = e.target.value;
      renderChecklist();
    });

    document.getElementById("status-filter").addEventListener("change", (e) => {
      state.statusFilter = e.target.value;
      renderChecklist();
    });

    document.getElementById("hot-filter").addEventListener("change", (e) => {
      state.hotOnly = e.target.checked;
      state.skippedOffset = 0;
      renderAll();
    });

    document.getElementById("btn-export").addEventListener("click", () => {
      const dataStr = JSON.stringify(
        {
          completed: state.completed,
          review: state.review,
          notes: state.notes,
          exportedAt: new Date().toISOString()
        },
        null,
        2
      );
      const blob = new Blob([dataStr], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "progresso-enem-2026.json";
      a.click();
      URL.revokeObjectURL(url);
    });

    document.getElementById("input-import").addEventListener("change", (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          state.completed = parsed.completed || {};
          state.review = parsed.review || {};
          state.notes = parsed.notes || {};
          saveState();
          renderAll();
        } catch (err) {
          alert("Arquivo de backup inválido.");
        }
      };
      reader.readAsText(file);
    });

    document.getElementById("btn-reset").addEventListener("click", () => {
      if (confirm("Tem certeza que deseja zerar todo o progresso marcado?")) {
        state.completed = {};
        state.review = {};
        state.notes = {};
        state.skippedOffset = 0;
        saveState();
        renderAll();
      }
    });

    // Initialize
    loadState();
    renderAll();
  </script>
</body>
</html>
